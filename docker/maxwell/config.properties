host=mysql84
user=maxwell
password=maxwell-local-only
replica_server_id=18457
producer=pubsub
pubsub_project_id=local-cdc
pubsub_topic=cdc
# Intentionally omit ddl_pubsub_topic. v1.46.0 compares Java String references;
# the default reuses the DML publisher, its emulator channel, and ordering setup.
pubsub_emulator=pubsub:8085
pubsub_message_ordering_key=mysql84
pubsub_message_count_batch_size=1
ignore_producer_error=false
producer_ack_timeout=30000
output_ddl=true
output_binlog_position=true
output_commit_info=true
output_xoffset=true
output_primary_keys=true
output_primary_key_columns=true
# With FULL row images, omitted fields mean SQL NULL; an explicit JSON null is
# retained by Maxwell's RawJSONString serializer. Do not change independently
# of the Swift applier: output_nulls=true loses that distinction for JSON columns.
output_nulls=false
filter=exclude: *.*, include: poc.*
log_level=info
http_port=8080
http_bind_address=0.0.0.0
http_diagnostic=true
